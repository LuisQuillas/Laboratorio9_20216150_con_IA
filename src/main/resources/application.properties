spring.application.name=Laboratio9
spring.thymeleaf.cache=false

# ===== Base de datos: stf_games_CODIGO (CODIGO = 20216150) =====
# Se puede sobreescribir con variables de entorno (DB_HOST, DB_PORT, DB_USER, DB_PASSWORD)
# o con --spring.datasource.* al levantar el jar en la nube.
# createDatabaseIfNotExist=true crea la BD si no existe.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/stf_games_20216150?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Brenda1234.}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Ejecuta schema.sql y data.sql al iniciar (crea la tabla stf_puzzle_sv y su unica fila)
spring.sql.init.mode=always

# Subida de imagenes
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=${PORT:8080}
